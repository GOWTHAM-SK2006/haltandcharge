server:
  port: 8080

spring:
  application:
    name: halt-charge-backend
  datasource:
    url: jdbc:h2:mem:haltchargedb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

jwt:
  # In local development, reads JWT_SECRET env var if set, otherwise defaults to local-dev-only secret
  secret: ${JWT_SECRET:local-development-only-insecure-secret-key-do-not-use-in-production-halt-and-charge-platform-ev}
  expiration-ms: 86400000

cors:
  allowed-origins: "http://localhost:5173,http://localhost:3000,http://localhost:8081,http://127.0.0.1:5173,http://localhost:19006,exp://*"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.haltcharge: INFO
    org.springframework.security: WARN
